name: Build and test Tron City API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TronApi.sln
      - run: dotnet build TronApi.sln --configuration Release --no-restore
      - run: dotnet test TronApi.sln --configuration Release --no-build
